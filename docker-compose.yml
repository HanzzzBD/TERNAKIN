services:
  ternakin-app:
    build: .
    container_name: ternakin-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/ternakin.sqlite
      ADMIN_KEY: ${ADMIN_KEY:?Wajib mengisi ADMIN_KEY di .env}
      SESSION_SECRET: ${SESSION_SECRET:?Wajib mengisi SESSION_SECRET di .env}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      SESI_BERLAKU_HARI: ${SESI_BERLAKU_HARI:-30}
      AKUN_DEMO_AKTIF: ${AKUN_DEMO_AKTIF:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_DARI: ${SMTP_DARI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-gemini-embedding-2}
      LLM_EMBEDDING_DIMENSI: ${LLM_EMBEDDING_DIMENSI:-768}
      LLM_THINKING_LEVEL: ${LLM_THINKING_LEVEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
      RAG_AMBANG_KEMIRIPAN: ${RAG_AMBANG_KEMIRIPAN:-0.6}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-600}
      LLM_DAILY_LIMIT_PER_DEVICE: ${LLM_DAILY_LIMIT_PER_DEVICE:-20}
      STALE_DAYS: ${STALE_DAYS:-7}
    volumes:
      - ternakin_sqlite:/data
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: ternakin-nginx
    restart: unless-stopped
    depends_on:
      - ternakin-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  ternakin_sqlite:
